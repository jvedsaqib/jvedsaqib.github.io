<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saqib Javed — Projects</title>
    <meta
      name="description"
      content="Projects in ML, Android, Flutter, and PHP. Java, Python, Firebase."
    />
    <meta property="og:title" content="Saqib Javed — Portfolio" />
    <meta
      property="og:description"
      content="Projects in ML, Android, and data. Java, Python, Firebase."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0ea5e9" />
    <link rel="icon" href="../assets/images/favicon/favicon-32x32.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    
    <style>
      :root {
        color-scheme: light dark;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
      }
      .card {
        transition: transform 0.2s ease;
      }
      .card:hover {
        transform: translateY(-4px);
      }
      .fade {
        opacity: 0;
        transform: scale(0.98);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .fade.show {
        opacity: 1;
        transform: scale(1);
      }
      .glass {
        backdrop-filter: saturate(150%) blur(10px);
        background: color-mix(in hsl, hsl(200 90% 55%) 12%, transparent);
      }
      /* Simple dark mode tweaks */
      @media (prefers-color-scheme: dark) {
        .glass {
          background: color-mix(in hsl, hsl(200 90% 55%) 18%, transparent);
        }
        .tag {
          border-color: rgb(99 102 241 / 0.35);
        }
      }
    </style>
  </head>

  <body
    class="bg-gradient-to-b from-slate-50 to-white dark:from-slate-950 dark:to-slate-900 text-slate-800 dark:text-slate-100"
  >
    <!-- HEADER -->
    <header class="sticky top-0 z-50 glass">
      <div
        class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between"
      >
        <a href="../" class="font-extrabold tracking-tight text-xl"
          >SJ<span class="text-sky-500">.</span></a
        >
        <h3>jvedsaqib - PROJECTS</h3>
        <nav class="hidden sm:flex items-center gap-6 text-sm">
          <!-- Theme toggle (desktop) -->
          <button
            type="button"
            class="theme-toggle ml-2 p-2 rounded-xl border border-slate-400/40 hover:bg-sky-500/10"
            aria-label="Toggle dark mode"
          >
            ☀️
          </button>
          <a class="font-bold hover:text-sky-500" href="../">Portfolio</a>
        </nav>
        <!-- Mobile: only theme toggle + CV -->
        <div class="flex sm:hidden items-center gap-3">
          <button
            type="button"
            class="theme-toggle p-2 rounded-xl border border-slate-400/40 hover:bg-sky-500/10"
            aria-label="Toggle dark mode"
          >
            ☀️
          </button>
      </div>
    </header>

    <!-- breadcrumbs -->
    <section class="flex justify-center text-sm mt-2">
      <nav class="flex space-x-1 dark:text-gray-400">
        <a href="/" class="text-sky-600 hover:underline flex items-center">
          🏠 Home
        </a>
        <span>/</span>
        <span class="font-semibold dark:text-gray-200">Projects</span> <span>/</span>
      </nav>
    </section>

    <!-- HERO -->
    <section class="text-center py-16">
      <h1 class="text-4xl sm:text-5xl font-extrabold text-center leading-tight">
        Explore My
        <span
          class="relative bg-clip-text text-transparent bg-gradient-to-r from-sky-400 via-indigo-500 to-purple-600"
        >
          Projects
        </span>
        Showcase
      </h1>

      <!-- Filter Buttons -->
      <!-- Buttons Row -->
      <div class="grid grid-flow-row">
        <div class="mt-10 flex flex-wrap justify-center gap-4">
          <button
            data-filter="all"
            class="filter-btn px-6 py-2 rounded-full font-medium shadow-lg text-white bg-gradient-to-r from-sky-400 to-blue-500 hover:from-sky-500 hover:to-blue-600 transition duration-300 relative overflow-hidden"
          >
            All
          </button>
          <button
            data-filter="ml"
            class="filter-btn px-6 py-2 rounded-full font-medium shadow-lg text-white bg-gradient-to-r from-purple-400 to-fuchsia-500 hover:from-purple-500 hover:to-fuchsia-600 transition duration-300 relative overflow-hidden"
          >
            ML
          </button>
          <button
            data-filter="php"
            class="filter-btn px-6 py-2 rounded-full font-medium shadow-lg text-white bg-gradient-to-r from-indigo-400 to-violet-500 hover:from-indigo-500 hover:to-violet-600 transition duration-300 relative overflow-hidden"
          >
            PHP
          </button>
          <button
            data-filter="android"
            class="filter-btn px-6 py-2 rounded-full font-medium shadow-lg text-white bg-gradient-to-r from-gray-500 to-emerald-500 hover:from-green-500 hover:to-emerald-600 transition duration-300 relative overflow-hidden"
          >
            Android
          </button>
          
        </div>
        <div class="gap-4 mt-4 flex flex-wrap justify-center">
          <button
            data-filter="flutter"
            class="filter-btn px-6 py-2 rounded-full font-medium shadow-lg text-white bg-gradient-to-r from-pink-400 to-rose-500 hover:from-pink-500 hover:to-rose-600 transition duration-300 relative overflow-hidden"
          >
            Flutter
          </button>
          <button
            data-filter="selenium"
            class="filter-btn px-6 py-2 rounded-full font-medium shadow-lg text-white bg-gradient-to-r from-yellow-400 to-rose-500 hover:from-yellow-500 hover:to-rose-600 transition duration-300 relative overflow-hidden"
          >
            Selenium
          </button>
        </div>
      </div>
    </section>

    <!-- PROJECTS GRID -->
    <section id="projects" class="py-10">
      <div class="max-w-6xl mx-auto px-4">
        <div
          id="projects-grid"
          class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"
        ></div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="py-10 text-center text-sm text-slate-500">
      © <span id="year"></span> Saqib Javed. Built with ❤️ on GitHub Pages.
    </footer>

    <!-- JS -->
    <script>
  const grid = document.getElementById("projects-grid");
  const filterButtons = document.querySelectorAll(".filter-btn");

  function renderProjects(projects) {
    grid.innerHTML = "";
    projects.forEach((p) => {
      const links = p.links
        .map((link) => {
          const baseClass =
            "inline-flex items-center px-3 py-2 rounded-full text-sm font-medium shadow transition";
          if (link.style === "emerald")
            return `<a href="${link.url}" target="_blank" class="${baseClass} bg-emerald-500 hover:bg-emerald-600 text-white">${link.label}</a>`;
          if (link.style === "sky")
            return `<a href="${link.url}" target="_blank" class="${baseClass} bg-sky-500 hover:bg-sky-600 text-white">${link.label}</a>`;
          if (link.style === "gray")
            return `<a href="${link.url}" target="_blank" class="${baseClass} bg-gray-800 hover:bg-gray-900 text-white">${link.label}</a>`;
          if (link.style === "disabled")
            return `<span class="${baseClass} bg-gray-400 text-gray-900 pointer-events-none">${link.label}</span>`;
          return "";
        })
        .join(" ");

      const card = `
        <article data-category="${p.category}" 
          class="card fade relative rounded-3xl p-6 border bg-gradient-to-br from-sky-400 to-sky-800 dark:bg-gradient-to-br dark:from-gray-900 dark:to-indigo-800 shadow flex flex-col justify-between text-white transition-transform transform hover:scale-105 hover:shadow-lg duration-300">
          <div class="absolute top-3 right-3">
            <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-sky-500">${p.badge}</span>
          </div>
          <div>
            <h3 class="text-xl font-bold">${p.title}</h3>
            <p class="mt-2 text-sm text-slate-200">${p.description}</p>
            ${
              p.timeline
                ? `<p class="mt-3 text-xs text-slate-300 italic">🕒 ${p.timeline}</p>`
                : ""
            }
          </div>
          <div class="mt-4 flex flex-wrap gap-2 justify-end">${links}</div>
        </article>`;

      grid.insertAdjacentHTML("beforeend", card);
    });

    document.querySelectorAll("#projects-grid article").forEach((card, i) => {
      setTimeout(() => card.classList.add("show"), i * 100);
    });
  }

  async function loadProjects() {
    const res = await fetch("../assets/data/projects.json");
    const allProjects = await res.json();
    renderProjects(allProjects);

    filterButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        filterButtons.forEach((b) =>
          b.classList.remove("ring-2", "ring-offset-2", "ring-sky-500")
        );
        btn.classList.add("ring-2", "ring-offset-2", "ring-sky-500");

        const filter = btn.dataset.filter;
        const filtered =
          filter === "all"
            ? allProjects
            : allProjects.filter((p) => p.category.includes(filter));
        renderProjects(filtered);
      });
    });
  }

  loadProjects();
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

    <script src="../scripts/theme.js"></script>
  </body>
</html>
